<title>데이터시트에서 회로도까지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* 영상처럼 넘어가는 장면 11개. 1200x675 무대를 화면 폭에 맞춰 줄이고, 자막은 무대 아래 보통 글자 크기로 둔다.
   어두운 오실로스코프 화면 한 가지 모양으로 고정한다 */
:root {
  --bg: #0b1316; --stage: #0f1b20; --panel: #15252b; --ink: #e6eef0; --muted: #8ea0a6; --line: #26383f;
  --accent: #4fb8d8; --violet: #a48ff0; --pass: #4cc27a; --fail: #ee6b5c; --warn: #f0a94a; --ghost: #33454c;
  --sans: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--sans); margin: 0; }
.page { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.top h1 { font-size: 20px; margin: 0; font-weight: 700; }
.top .meta { font-size: 13px; color: var(--muted); }
.screen { position: relative; width: 100%; border-radius: 10px; overflow: hidden; background: var(--stage); border: 1px solid var(--line); }
.stage { position: absolute; left: 0; top: 0; width: 1200px; height: 675px; transform-origin: 0 0; overflow: hidden; }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0,0,0,.35)); }
.scene-title { position: absolute; left: 40px; top: 28px; display: flex; gap: 14px; align-items: baseline; z-index: 3; }
.scene-title .no { font-family: var(--mono); color: var(--accent); font-size: 18px; }
.scene-title .name { font-size: 30px; font-weight: 700; }

/* 자막과 조작 */
.caption { min-height: 92px; display: grid; gap: 6px; align-content: start; }
.caption p { margin: 0; font-size: 18px; line-height: 1.6; max-width: 72ch; }
.caption p.old { color: var(--muted); font-size: 15px; }
.caption p.new { animation: cap .5s ease both; }
@keyframes cap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.controls button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); cursor: pointer; }
.controls button.primary { background: var(--accent); color: #062029; border-color: var(--accent); font-weight: 700; min-width: 92px; }
.controls button:focus-visible, .seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.segs { display: flex; gap: 4px; flex: 1 1 260px; min-width: 0; }
.seg { flex: 1; height: 26px; border: 0; padding: 0; background: transparent; cursor: pointer; display: grid; align-items: center; }
.seg span { display: block; height: 5px; border-radius: 3px; background: var(--ghost); overflow: hidden; }
.seg span i { display: block; height: 100%; width: 0; background: var(--accent); }
.hint { font-size: 12px; color: var(--muted); }

/* 무대 요소 */
.h { opacity: 0; }
.abs { position: absolute; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.big { font-family: var(--mono); font-weight: 500; }
.label { font-size: 15px; color: var(--muted); }
.mono { font-family: var(--mono); }
.chip { font-family: var(--mono); font-size: 15px; padding: 6px 10px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
.chip b { color: var(--accent); font-weight: 500; }
.arrow { font-size: 64px; color: var(--accent); font-family: var(--mono); }
.model { display: grid; place-items: center; text-align: center; border: 2px solid var(--accent); border-radius: 18px; background: var(--panel); }
.model .t { font-size: 30px; font-weight: 700; } .model .s { font-size: 14px; color: var(--muted); }
.dot { position: absolute; width: 14px; height: 14px; border-radius: 3px; background: var(--accent); transition: background .6s, opacity .6s, transform .6s; }
.dot.out1 { background: var(--fail); opacity: .18; }
.dot.out2 { background: var(--ghost); opacity: .35; }
.dot.blk { background: var(--violet); }
.counter { display: grid; gap: 2px; }
.counter .big { font-size: 46px; line-height: 1; }
.counter .label { font-size: 16px; }
.tile { position: absolute; border-radius: 8px; background: var(--panel); border: 2px solid var(--line); display: grid; place-items: center; text-align: center;
  font-family: var(--mono); transition: background .35s, border-color .35s, opacity .5s, transform .5s; }
.tile .n { font-size: 12px; color: var(--muted); } .tile .r { font-size: 18px; font-weight: 500; }
.tile.beam { border-color: var(--accent); } .tile.sample { border-color: var(--violet); }
.tile.ok { background: #173a28; border-color: var(--pass); } .tile.ok .r { color: var(--pass); }
.tile.bad { background: #3a1d1b; border-color: var(--fail); } .tile.bad .r { color: var(--fail); font-size: 12px; }
.tile.rule { background: #3a2b14; border-color: var(--warn); }
.tile.scan { box-shadow: 0 0 0 4px var(--accent), 0 0 30px var(--accent); }
.bar-h { height: 34px; border-radius: 6px; background: var(--ghost); overflow: hidden; }
.bar-h i { display: block; height: 100%; width: 0; background: var(--accent); }
.rank-bar { position: absolute; bottom: 110px; border-radius: 6px 6px 0 0; background: var(--accent); transform-origin: bottom; }
.rank-bar.sel { background: var(--pass); box-shadow: 0 0 34px rgba(76,194,122,.6); }
.rank-lab { position: absolute; bottom: 80px; font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: center; }
.rank-val { position: absolute; font-family: var(--mono); font-size: 16px; text-align: center; }
.refline { position: absolute; border-top: 2px dashed var(--warn); }
.pill { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 10px; }
.pill.PASS { background: #173a28; color: var(--pass); } .pill.FAIL { background: #3a1d1b; color: var(--fail); } .pill.미측정 { background: var(--ghost); color: var(--muted); }
.specrow { display: grid; grid-template-columns: 1fr 130px 120px 70px; gap: 8px; align-items: center; font-size: 15px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.specrow .mono { font-size: 14px; }
svg text { font-family: var(--mono); fill: var(--muted); font-size: 13px; }
.g-link { stroke: #5b7179; stroke-width: 1.6; fill: none; }
.g-link.G { stroke-dasharray: 5 4; }
.g-dev rect { fill: var(--panel); stroke-width: 2; } .g-dev.pm rect { stroke: var(--violet); } .g-dev.nm rect { stroke: var(--accent); } .g-dev.rc rect { stroke: var(--muted); }
.g-dev.added rect { fill: #1d4553; }
.g-dev text { fill: var(--ink); font-size: 13px; font-weight: 500; }
.g-net circle { fill: #5b7179; } .g-net.port circle { fill: var(--stage); stroke-width: 3; }
.g-net.rail circle { stroke: var(--violet); } .g-net.in circle { stroke: var(--accent); } .g-net.out circle { stroke: var(--warn); } .g-net.bias circle { stroke: var(--pass); }
.g-net text { fill: var(--ink); font-size: 14px; font-weight: 700; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; }

@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes fly { from { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2); } to { opacity: 1; transform: none; } }
@keyframes drop { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(70px) rotate(10deg); } }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes drawline { to { stroke-dashoffset: 0; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(79,184,216,0); } 50% { box-shadow: 0 0 46px 6px rgba(79,184,216,.55); } }
@keyframes wipe { from { opacity: 1; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
@keyframes type { from { opacity: 1; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
.paper { background: #fbfbf7; border-radius: 12px; padding: 18px; box-sizing: border-box; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.paper svg text { fill: #000; font-family: "Courier New", monospace; }
.step { position: absolute; border: 2px solid var(--line); border-radius: 14px; background: var(--panel); padding: 14px 12px; box-sizing: border-box; display: grid; gap: 6px; align-content: start; transition: border-color .4s, box-shadow .4s, background .4s; }
.step .k { font-family: var(--mono); color: var(--muted); font-size: 14px; }
.step .t { font-size: 19px; font-weight: 700; line-height: 1.3; }
.step .d { font-size: 14px; color: var(--muted); line-height: 1.45; }
.step.on { border-color: var(--accent); background: #17323b; box-shadow: 0 0 30px rgba(79,184,216,.35); }
.step.on .k { color: var(--accent); }
.xrow { display: grid; grid-template-columns: 210px 1fr 40px 190px; gap: 10px; align-items: center; font-size: 15px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.xrow .src { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.xrow .to { font-family: var(--mono); color: var(--pass); font-weight: 500; }
.xrow.miss { opacity: .45; }
.xrow.miss .to { color: var(--muted); }
.paused * { animation-play-state: paused !important; }
.rm * { animation-duration: 1ms !important; animation-delay: 0ms !important; transition: none !important; }
@media (max-width: 700px) { .caption p { font-size: 16px; } .caption p.old { font-size: 14px; } }
</style>

<div class="page">
  <div class="top"><h1 id="h1">데이터시트에서 회로도까지</h1><span class="meta" id="meta"></span></div>
  <div class="screen" id="screen"><div class="stage" id="stage"></div></div>
  <div class="controls">
    <button id="prev" type="button" aria-label="이전 장면">이전</button>
    <button id="play" type="button" class="primary">일시정지</button>
    <button id="next" type="button" aria-label="다음 장면">다음</button>
    <div class="segs" id="segs"></div>
  </div>
  <div class="caption" id="caption" aria-live="polite"></div>
  <p class="hint">스페이스: 재생/멈춤 · ←/→: 장면 이동 · 아래 막대를 누르면 그 장면으로 갑니다</p>
</div>

<script>
const DATA = /*DATA*/null;
const E = DATA.entries;
const S = DATA.summary || {ranking: [], selected: null};
const SEL = S.selected;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const stage = document.getElementById("stage");
const fmt = v => v == null ? "—" : (Math.abs(v) >= 1000 || (Math.abs(v) < 0.01 && v !== 0) ? Number(v).toPrecision(3) : String(+Number(v).toPrecision(3)));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const bestVariant = e => e.best ? e.variants.find(v => v.output_scale === e.best.output_scale) : null;
const novelty = e => e.nearest.added.length + e.nearest.removed.length;
const working = E.filter(e => e.best);
const rulesOk = E.filter(e => e.rules.ok);
const generated = DATA.generated.beam + DATA.generated.sample;
const NJ = DATA.spec.length;                       // 판정하는 항목 수
const PART = DATA.part;
const X = DATA.extraction;
const trainMax = Math.max(...DATA.training.map(t => t.passed));
const trainMaxCount = DATA.training.filter(t => t.passed === trainMax).length;
const fromGenie = DATA.training.filter(t => t.source.includes("analoggenie")).length;
const fromBlocks = DATA.training.length - fromGenie;
function shortReason(r) {
  if (!r) return "";
  if (r.startsWith("꺼진 소자")) return "꺼진 소자";
  if (r.startsWith("포화 영역 밖")) return "포화 밖";
  if (r.includes("이득")) return "이득 부족";
  if (r.includes("시간 초과")) return "시간 초과";
  if (r.includes("출력")) return "출력 벗어남";
  return "탈락";
}

/* netlistsvg 회로도를 상자 크기에 맞춰 넣는다 */
function paper(box, svgText) {
  box.innerHTML = svgText || '<div style="color:#555;padding:20px">회로도가 아직 없습니다 (make_schematic_svg.py)</div>';
  const svg = box.querySelector("svg");
  if (svg) {
    const w = svg.getAttribute("width"), h = svg.getAttribute("height");
    if (w && h && !svg.getAttribute("viewBox")) svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.removeAttribute("width"); svg.removeAttribute("height");
    Object.assign(svg.style, {width: "100%", height: "100%"});
  }
}

/* ---------- 시간표: 멈추면 장면 시계도 멈춘다 ---------- */
let events = [], tweens = [], t = 0, playing = !reduce, last = null, idx = 0, captions = [];
const at = (ms, fn) => events.push({ms, fn});
const tween = (ms, dur, fn) => tweens.push({ms, dur, fn, done: false});
const ease = p => 1 - Math.pow(1 - p, 3);
function el(cls, html = "", style = {}, parent = stage) {
  const d = document.createElement("div"); d.className = cls; d.innerHTML = html; Object.assign(d.style, style); parent.appendChild(d); return d;
}
const px = v => v + "px";
function anim(node, ms, name = "pop", dur = 600) {
  at(ms, () => { node.style.animation = `${name} ${dur}ms cubic-bezier(.2,.8,.2,1) forwards`; });
}
function count(node, ms, dur, to, suffix = "") {
  tween(ms, dur, p => { node.textContent = Math.round(to * p).toLocaleString() + suffix; });
}
function caption(lines) { captions = lines; lines.forEach(([ms]) => at(ms, renderCaption)); }
function renderCaption() {
  const shown = captions.filter(([ms]) => ms <= t);
  const box = document.getElementById("caption");
  box.innerHTML = shown.map(([, text], k) => `<p class="${k === shown.length - 1 ? "new" : "old"}">${text}</p>`).join("");
}
function title(n, name) { el("scene-title", `<span class="no">${n} / ${SCENES.length}</span><span class="name">${name}</span>`); }

/* ---------- 장면 ---------- */
const SCENES = [].concat([
{ name: "목표", dur: 10000, build() {
  const pdf = el("abs card h", `<div class="label">입력</div><div style="font-size:28px;font-weight:700;margin-top:4px">OP-Amp 데이터시트</div><div class="mono" style="color:var(--muted);margin-top:2px">PDF</div>`, {left: px(50), top: px(150), width: px(300), height: px(380), padding: "22px", boxSizing: "border-box"});
  for (let k = 0; k < 9; k++) el("", "", {height: "10px", width: (60 + (k * 37) % 40) + "%", background: "var(--ghost)", borderRadius: "4px", marginTop: k ? "12px" : "26px"}, pdf);
  anim(pdf, 200, "rise");
  const a1 = el("abs arrow h", "→", {left: px(370), top: px(300)}); anim(a1, 1600, "pop");
  const m = el("abs model h", `<div><div class="t">EDAI</div><div class="s">자동 설계</div></div>`, {left: px(450), top: px(270), width: px(150), height: px(130)});
  anim(m, 1900, "pop"); at(2500, () => { m.style.animation = "pulse 1.6s ease-in-out 3"; m.style.opacity = 1; });
  const a2 = el("abs arrow h", "→", {left: px(615), top: px(300)}); anim(a2, 3200, "pop");
  const out = el("abs paper h", "", {left: px(700), top: px(110), width: px(460), height: px(460)});
  paper(out, SEL != null ? E[SEL].schematic : null);
  anim(out, 3600, "wipe", 1600);
  const lab = el("abs h", `<span class="label">출력: 트랜지스터 회로도</span>`, {left: px(700), top: px(585)}); anim(lab, 4800, "fade");
  caption([[0, "목표: OP-Amp 데이터시트(PDF)를 넣으면, 그 성능을 낼 수 있는 트랜지스터 회로가 회로도로 나오게 하는 것입니다."],
           [3600, "지금은 사람이 데이터시트를 읽고, 회로 구조를 고르고, 크기를 정합니다. 이 과정을 자동으로 이어 붙였습니다."]]);
}},
{ name: "전체 흐름", dur: 13000, build() {
  const steps = [["데이터시트", "PDF 그대로"], ["정보 추출", "핀, 전기적 특성 표"], ["충족 기준 정리", "시험할 항목과 목표값"],
                 ["구조 후보 생성", "학습한 언어 모델 FLAN-T5"], ["걸러내기·시뮬레이션", "규칙 검사, 크기 정하기, ngspice"],
                 ["판정·선택", "목표값 통과 수로 순위"], ["회로도", "netlistsvg 자동 배치"]];
  const w = 150, gap = 11, x0 = 30, y = 200;
  const boxes = steps.map(([t2, d], k) => {
    const b = el("step h", `<span class="k">${k + 1}</span><span class="t">${t2}</span><span class="d">${d}</span>`, {left: px(x0 + k * (w + gap)), top: px(y), width: px(w), height: px(190)});
    anim(b, 200 + k * 150, "rise", 500);
    return b;
  });
  boxes.forEach((b, k) => at(1800 + k * 1100, () => { boxes.forEach(x => x.classList.remove("on")); b.classList.add("on"); }));
  at(1800 + steps.length * 1100, () => boxes.forEach(x => x.classList.add("on")));
  const brace1 = el("abs h", `<div style="border-top:2px solid var(--violet);padding-top:8px;color:var(--violet);font-size:17px">무엇을 맞춰야 하나</div>`, {left: px(x0), top: px(y + 215), width: px(3 * w + 2 * gap)});
  const brace2 = el("abs h", `<div style="border-top:2px solid var(--pass);padding-top:8px;color:var(--pass);font-size:17px">어떤 회로로 맞추나</div>`, {left: px(x0 + 3 * (w + gap)), top: px(y + 215), width: px(4 * w + 3 * gap)});
  anim(brace1, 9800, "rise"); anim(brace2, 10400, "rise");
  caption([[0, "전체 흐름은 7단계입니다."],
           [1800, "데이터시트에서 핀과 전기적 특성 표를 뽑고, 그중 시뮬레이션으로 확인할 항목과 목표값을 정리합니다."],
           [5100, "목표값을 학습한 언어 모델에 넣어 회로 구조 후보를 여러 개 받고, 규칙 검사와 시뮬레이션으로 걸러 가장 잘 맞는 구조를 고릅니다."],
           [8400, "고른 구조는 회로도로 그려 냅니다. 먼저 구조를 고르는 모델을 어떻게 준비했는지 보고, " + (X ? `${esc(X.device.name)} 데이터시트를 실제로 넣어 봅니다.` : `${PART}로 시험합니다.`)]]);
}},
{ name: "준비 1: 학습 재료", dur: 11000, build() {
  const total = 568, opamp = 435, cols = 26, pitch = 21, x0 = 60, y0 = 110;
  const dots = [];
  for (let k = 0; k < total; k++) { const d = el("dot h", "", {left: px(x0 + (k % cols) * pitch), top: px(y0 + Math.floor(k / cols) * pitch)}); dots.push(d); anim(d, 200 + k * 2, "pop", 300); }
  const order = dots.map((d, k) => [((k * 7919) % 568), d]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  at(3000, () => order.slice(0, total - opamp).forEach(d => d.classList.add("out1")));
  at(5600, () => order.slice(total - opamp, total - fromGenie).forEach(d => d.classList.add("out2")));
  const blocks = [];
  for (let k = 0; k < fromBlocks; k++) { const d = el("dot blk h", "", {left: px(x0 + ((total + k) % cols) * pitch), top: px(y0 + Math.floor((total + k) / cols) * pitch)}); blocks.push(d); anim(d, 8000 + k * 60, "pop", 400); }
  const right = el("abs", "", {left: px(640), top: px(110), width: px(520), display: "grid", gap: "26px"});
  const rows = [[200, total, "AnalogGenie 공개 회로", "var(--accent)"], [3000, opamp, "그중 OP-Amp만", "var(--ink)"],

    const tl = tiles[k]; tl.classList.add("scan"); setTimeout(() => tl.classList.remove("scan"), 300);
    if (e.best) { tl.classList.add("ok"); tl.querySelector(".r").textContent = `${e.best.passed}/${NJ}`; ok++; cOk.querySelector(".big").textContent = ok; }
    else { const r = shortReason(e.variants[0] && e.variants[0].reason); tl.classList.add("bad"); tl.querySelector(".r").textContent = r; bad++; cBad.querySelector(".big").textContent = bad; tally[r] = (tally[r] || 0) + 1;
      reasons.innerHTML = Object.entries(tally).sort((a, b) => b[1] - a[1]).map(([r2, n]) => `${r2} ${n}`).join("<br>"); }
  }));
  caption([[0, "남은 후보마다 트랜지스터 크기(W/L)를 자동으로 정하고 ngspice로 시뮬레이션합니다. 출력단 전류를 1배, 5배 두 가지로 해 봅니다."],
           [2400, "동작 판정: 출력이 VDD/2 근처에 있고, 모든 트랜지스터가 켜져 증폭할 수 있는 상태(포화 영역)이고, 이득이 20 dB 이상이어야 합니다."],
           [2400 + rulesOk.length * 160, `동작하면 ${PART} 목표 ${NJ}개 항목을 재서 통과 수를 적습니다. 꺼진 소자는 전류가 흐르지 않는 트랜지스터입니다.`]]);
}},
{ name: "시연: 순위 매기기", dur: 10000, build() {
  const order = S.ranking || [];
  const chartL = 120, chartW = 960, chartH = 400, base = 675 - 110;
  const bw = Math.min(70, chartW / order.length - 14);
  const yOf = v => chartH * v / NJ;
  for (let v = 0; v <= NJ; v += 5) { el("abs", "", {left: px(chartL - 10), width: px(chartW + 20), top: px(base - yOf(v)), borderTop: "1px solid var(--line)"}); el("abs mono", String(v), {left: px(chartL - 40), top: px(base - yOf(v) - 10), fontSize: "13px", color: "var(--muted)"}); }
  el("abs label", `통과 항목 수 (${NJ}개 중)`, {left: px(chartL - 40), top: px(base - chartH - 40)});
  order.forEach((i, r) => {
    const e = E[i], x = chartL + r * (chartW / order.length) + 7;
    const b = el(`rank-bar h ${i === SEL ? "sel" : ""}`, "", {left: px(x), width: px(bw), height: px(yOf(e.best.passed))});
    at(600 + r * 150, () => { b.style.opacity = 1; b.style.animation = "grow 700ms cubic-bezier(.2,.8,.2,1) both"; });
    const lab = el("rank-lab h", `후보<br>${e.no}`, {left: px(x - 10), width: px(bw + 20)}); anim(lab, 600 + r * 150, "fade");
    const val = el("rank-val h", `${e.best.passed}`, {left: px(x), width: px(bw), bottom: px(110 + yOf(e.best.passed) + 6)}); anim(val, 1100 + r * 150, "fade");
  });
  const ref = el("refline h", "", {left: px(chartL - 10), width: px(chartW + 20), top: px(base - yOf(trainMax))}); anim(ref, 4200, "fade");
  const refl = el("abs h", `학습 구조 ${DATA.training.length}개를 같은 방식으로 재면 최고 ${trainMax}/${NJ} (${trainMaxCount}개)`, {left: px(chartL + 10), top: px(base - yOf(trainMax) - 30), color: "var(--warn)", fontSize: "16px"}); anim(refl, 4200, "rise");
  if (SEL != null) { const s = el("abs h", `선택: 후보 ${E[SEL].no}`, {left: px(chartL + 7 - 20), top: px(base - yOf(E[SEL].best.passed) - 70), color: "var(--pass)", fontSize: "22px", fontWeight: 700}); anim(s, 6200, "pop"); }
  caption([[0, "동작한 후보를 통과 항목 수로 줄 세웁니다. 통과 수가 같으면 전류를 덜 쓰는 쪽이 앞입니다."],
           [4200, `비교 기준: 학습에 쓴 구조 ${DATA.training.length}개를 같은 방식으로 재면 최고 ${trainMax}/${NJ}입니다. 후보들은 아직 그보다 낮습니다.`],
           [6200, SEL == null ? "동작한 후보가 없습니다." : `가장 많이 통과한 후보 ${E[SEL].no}(${E[SEL].best.passed}/${NJ})를 고릅니다.`]]);
}},
{ name: "결과: 회로도", dur: 12000, build() {
  if (SEL == null) return;
  const e = E[SEL];
  const sheet = el("abs paper h", "", {left: px(40), top: px(90), width: px(820), height: px(560)});
  paper(sheet, e.schematic);
  anim(sheet, 300, "wipe", 2200);
  const nT = e.rows.filter(r => /^[NP]M/.test(r[0])).length;
  const side = el("abs", "", {left: px(890), top: px(100), width: px(270), display: "grid", gap: "18px"});
  [[`후보 ${e.no}`, "선택된 구조"], [`${nT}개`, "트랜지스터"], [`${e.best.passed} / ${NJ}`, "목표 통과 항목"], ["netlistsvg", "배치·배선 자동"]].forEach(([v, l], k) => {
    const c = el("counter h", `<span class="big" style="font-size:${k === 3 ? 26 : 40}px">${v}</span><span class="label">${l}</span>`, {}, side);
    anim(c, 2600 + k * 500, "rise");
  });
  caption([[0, `선택된 후보 ${e.no}의 회로도입니다. 넷리스트를 netlistsvg에 넣어 소자 배치와 배선을 도구가 자동으로 정했습니다.`],
           [4000, "위쪽 화살표가 전원(VDD), 아래 접지 기호가 VSS, 왼쪽 IN1·IN2가 입력, 오른쪽 OUT이 출력입니다. 소자 옆 숫자는 자동으로 정한 크기(W/L)입니다."],
           [8000, novelty(e) === 0 ? "이 구조는 학습 데이터에 있던 구조 그대로입니다." : `학습 데이터에서 가장 비슷한 구조와 ${novelty(e)}줄이 다른 구조입니다.`]]);
}},
{ name: "시연: 측정 결과", dur: 13000, build() {
  if (SEL == null) return;
  const e = E[SEL], v = bestVariant(e), c = e.curves;
  const by = Object.fromEntries(v.spec.map(s => [s.measure, s]));
  if (c && c.freq) {
    const W = 560, H = 380, L = 60, T = 120, f0 = c.freq[0], f1 = c.freq[c.freq.length - 1];
    const top = Math.ceil(Math.max(...c.mag_db) / 20) * 20, bot = -40;
    const X = f => L + W * (Math.log10(f) - Math.log10(f0)) / (Math.log10(f1) - Math.log10(f0));
    const Y = m => T + H * (top - Math.max(bot, Math.min(top, m))) / (top - bot);
    let d = ""; c.freq.forEach((f, k) => { d += (k ? "L" : "M") + X(f).toFixed(1) + "," + Y(c.mag_db[k]).toFixed(1); });
    let grid = ""; for (let m = bot; m <= top; m += 20) grid += `<line x1="${L}" x2="${L + W}" y1="${Y(m)}" y2="${Y(m)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(m) + 4}" text-anchor="end">${m}</text>`;
    for (let p = Math.ceil(Math.log10(f0)); p <= Math.floor(Math.log10(f1)); p += 2) { const f = 10 ** p; grid += `<text x="${X(f)}" y="${T + H + 20}" text-anchor="middle">${f >= 1e6 ? f / 1e6 + "M" : f >= 1e3 ? f / 1e3 + "k" : f}</text>`; }
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 1200 675"); Object.assign(svg.style, {position: "absolute", inset: 0, width: px(1200), height: px(675)});
    svg.innerHTML = `${grid}<line x1="${L}" x2="${L + W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
      <text x="${L}" y="${T - 14}" style="fill:var(--ink);font-size:15px">이득 (dB) · 주파수 (Hz)</text>
      <path d="${d}" class="draw" pathLength="1" style="stroke:var(--accent);stroke-width:3;fill:none" id="bodePath"/>`;
    stage.appendChild(svg);
    at(800, () => { svg.querySelector("#bodePath").style.animation = "drawline 2600ms ease forwards"; });
    const note = el("abs h", `DC 이득 <b class="mono">${fmt(c.mag_db[0])} dB</b> · 0 dB 지점(대역폭) <b class="mono">${by.ugbw ? fmt(by.ugbw.value) + " MHz" : "—"}</b>`, {left: px(L), top: px(T + H + 40), fontSize: "16px"});
    anim(note, 3400, "rise");
  }
  const box = el("abs", "", {left: px(670), top: px(96), width: px(500)});
  el("specrow", `<span class="label">항목</span><span class="label">목표</span><span class="label">측정</span><span></span>`, {}, box);
  DATA.spec.forEach((s, k) => {
    const r = by[s.measure];
    const row = el("specrow h", `<span>${esc(s.label)}</span><span class="mono">${esc(s.target)}</span><span class="mono">${r ? fmt(r.value) + " " + esc(s.unit) : "—"}</span><span class="pill ${r ? r.status : "미측정"}">${r ? (r.status === "PASS" ? "통과" : r.status === "FAIL" ? "미달" : "못 잼") : "—"}</span>`, {fontSize: "14px", padding: "3px 0"}, box);
    anim(row, 3600 + k * 220, "rise", 350);
  });
  const fails = v.spec.filter(r => r.status !== "PASS").map(r => (DATA.spec.find(s => s.measure === r.measure) || {}).label).filter(Boolean);
  caption([[0, "고른 회로를 시뮬레이션으로 잰 결과입니다. 왼쪽은 주파수에 따른 이득입니다. 선이 0 dB를 지나는 곳까지가 증폭할 수 있는 대역입니다."],
           [3600, `오른쪽은 ${PART} 목표 ${NJ}개 항목의 목표와 측정값입니다.`],
           [3600 + NJ * 220, `${NJ}개 중 ${e.best.passed}개 통과. 미달: ${fails.slice(0, 5).join(", ")}${fails.length > 5 ? " 등" : ""}.`]]);
}},
{ name: "정리", dur: 12000, build() {
  const nums = [[E.length, "구조 후보", "var(--ink)"], [rulesOk.length, "규칙 통과", "var(--accent)"], [working.length, "동작", "var(--pass)"], [SEL == null ? 0 : E[SEL].best.passed, `선택 구조 통과 항목 / ${NJ}`, "var(--warn)"]];
  nums.forEach(([n, label, color], k) => {
    const c = el("abs card h", `<div class="big" style="font-size:64px;color:${color}">${n}</div><div class="label" style="font-size:17px">${label}</div>`, {left: px(40 + k * 285), top: px(120), width: px(265), height: px(170), padding: "22px", boxSizing: "border-box"});
    anim(c, 300 + k * 400, "pop");
  });
  const lines = [["자동으로 되는 것", "데이터시트 → 정보 추출 → 기준 정리 → 구조 후보 → 규칙 검사·크기·시뮬레이션 → 선택 → 회로도"],
                 ["아직 부족한 것", `지금 크기는 '동작하는' 크기일 뿐 스펙에 맞춘 크기가 아니라서, 통과 수가 높지 않습니다 (학습 구조 최고 ${trainMax}/${NJ}).`],
                 ["다음 단계", "고른 구조의 크기를 스펙에 맞춰 다시 조정합니다 (기존 LLM + 수식 설계 루프)."]];
  lines.forEach(([h, text], k) => {
    const r = el("abs h", `<div class="label" style="font-size:15px">${h}</div><div style="font-size:21px;margin-top:2px">${text}</div>`, {left: px(40), top: px(340 + k * 100), width: px(1120)});
    anim(r, 2400 + k * 1500, "rise");
  });
  caption([[0, "정리하면, 데이터시트를 넣으면 정보 추출, 기준 정리, 구조 후보 생성, 걸러내기, 시뮬레이션, 선택, 회로도까지 사람 손 없이 이어집니다."],
           [3900, "통과 수가 낮은 이유는 구조가 아니라 크기 때문일 수 있습니다. 지금은 모든 구조를 같은 규칙으로 '일단 동작하게'만 크기를 정합니다."],
           [5400, `다음은 고른 구조의 트랜지스터 크기를 ${PART} 목표에 맞춰 다시 조정하는 단계입니다.`]]);
}},
]).filter(sc => !sc.when || sc.when());

/* ---------- 재생 ---------- */
const segs = document.getElementById("segs");
segs.innerHTML = SCENES.map((s, k) => `<button class="seg" type="button" data-k="${k}" aria-label="${k + 1}. ${s.name}"><span><i></i></span></button>`).join("");
function enter(k) {
  idx = Math.max(0, Math.min(SCENES.length - 1, k));
  stage.innerHTML = ""; events = []; tweens = []; t = 0; captions = [];
  stage.className = "stage" + (playing ? "" : " paused") + (reduce ? " rm" : "");
  title(idx + 1, SCENES[idx].name);
  SCENES[idx].build();
  events.sort((a, b) => a.ms - b.ms);
  if (reduce) { t = SCENES[idx].dur; flush(); }
  document.getElementById("meta").textContent = `${PART} · ${idx + 1}. ${SCENES[idx].name}`;
  renderCaption(); paintSegs();
}
function flush() {
  while (events.length && events[0].ms <= t) events.shift().fn();
  tweens.forEach(tw => { if (tw.done || t < tw.ms) return; const p = Math.min(1, (t - tw.ms) / tw.dur); tw.fn(ease(p)); if (p >= 1) tw.done = true; });
}
function paintSegs() {
  segs.querySelectorAll(".seg i").forEach((bar, k) => { bar.style.width = k < idx ? "100%" : k > idx ? "0%" : Math.min(100, 100 * t / SCENES[idx].dur) + "%"; });
}
function loop(now) {
  if (last != null && playing) {
    t += now - last; flush(); paintSegs();
    if (t >= SCENES[idx].dur) { if (idx < SCENES.length - 1) enter(idx + 1); else setPlaying(false); }
  }
  last = now; requestAnimationFrame(loop);
}
function setPlaying(p) {
  playing = p; stage.classList.toggle("paused", !p);
  document.getElementById("play").textContent = p ? "일시정지" : (idx === SCENES.length - 1 && t >= SCENES[idx].dur ? "처음부터" : "재생");
}
document.getElementById("play").addEventListener("click", () => {
  if (!playing && idx === SCENES.length - 1 && t >= SCENES[idx].dur) { setPlaying(true); enter(0); return; }
  setPlaying(!playing);
});
document.getElementById("prev").addEventListener("click", () => enter(idx - 1));
document.getElementById("next").addEventListener("click", () => enter(idx + 1));
segs.addEventListener("click", ev => { const b = ev.target.closest(".seg"); if (b) enter(+b.dataset.k); });
document.addEventListener("keydown", ev => {
  if (ev.key === " ") { ev.preventDefault(); document.getElementById("play").click(); }
  if (ev.key === "ArrowRight") enter(idx + 1);
  if (ev.key === "ArrowLeft") enter(idx - 1);
});
const screen = document.getElementById("screen");
function fit() { const s = screen.clientWidth / 1200; stage.style.transform = `scale(${s})`; screen.style.height = (675 * s) + "px"; }
new ResizeObserver(fit).observe(screen); fit();
setPlaying(playing); enter(0); requestAnimationFrame(loop);
</script>
