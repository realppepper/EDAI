<title>EDAI 설계 결과</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 왼쪽 실행 목록(칩별 거르기) + 오른쪽 결과 화면. 좁은 화면에서는 위아래로 쌓음 */
:root {
  --bg: #eef1f4; --panel: #ffffff; --fg: #18202b; --muted: #5d6877; --line: #d6dce4;
  --accent: #1f5fa8; --accent-soft: #e3ecf7; --ok: #1a7f37; --bad: #b42318; --run: #a15c00;
  --sans: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151b; --panel: #181d25; --fg: #e4e8ee; --muted: #93a0b0; --line: #2a313c;
  --accent: #7fb0ec; --accent-soft: #1d2a3a; --ok: #4cc26b; --bad: #f07a6e; --run: #e0a13c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11151b; --panel: #181d25; --fg: #e4e8ee; --muted: #93a0b0; --line: #2a313c;
  --accent: #7fb0ec; --accent-soft: #1d2a3a; --ok: #4cc26b; --bad: #f07a6e; --run: #e0a13c; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.55 var(--sans); }
.wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; max-width: 1400px; margin: 0 auto;
        padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; text-wrap: balance; }
.flow { color: var(--muted); font-size: 13px; }
.flow b { color: var(--fg); font-weight: 500; }
aside { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px/1 var(--mono); letter-spacing: .02em; border: 1px solid var(--line); background: var(--panel);
        color: var(--muted); border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.list { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        overflow: hidden; }
.item { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0;
        border-bottom: 1px solid var(--line); padding: 10px 12px; cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--accent-soft); }
.item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.t { font-weight: 600; font-family: var(--mono); font-size: 13px; }
.m { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.st-done { color: var(--ok); } .st-failed { color: var(--bad); } .st-running { color: var(--run); }
.pass { font-family: var(--mono); color: var(--fg); }
.note { color: var(--muted); font-size: 12px; }
main { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.empty { padding: 48px 24px; color: var(--muted); text-align: center; }
#report { display: block; }
@media (max-width: 820px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: no-preference) { .item, .chip { transition: background .12s; } }
</style>

<div class="wrap">
  <header>
    <h1>EDAI 설계 결과</h1>
    <span class="flow">데이터시트 → <b>분석(HKG·PDG)</b> → <b>모델 구조 후보</b> → 크기 정하기 → 규칙 → <b>하네스</b> → 회로도 · 보기 전용</span>
  </header>
  <aside>
    <div class="chips" id="chips" role="group" aria-label="칩으로 거르기"></div>
    <div class="list" id="list"></div>
    <p class="note">같은 칩은 먼저 돌린 순서대로 (1), (2)… 메모는 그 실행이 무엇이 달랐는지 적은 것이에요.</p>
  </aside>
  <main>
    <div class="empty" id="empty">왼쪽에서 결과를 고르세요</div>
    <div id="report" hidden></div>
  </main>
</div>

<script>
const RUNS = /*RUNS*/[];
const STATE = { done: "완료", failed: "실패", running: "진행 중", unsupported: "생성 불가 (전압 조건)" };
let chip = "전체", current = null;

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const hashOf = id => "r-" + id.replace(/_/g, "-");
const idOf = hash => (RUNS.find(r => hashOf(r.id) === hash.replace(/^#/, "")) || {}).id;

function line(r) {
  const state = r.state === "done" ? "완료" : `${STATE[r.state] || ""} (${r.done}/${r.total}단계)`;
  const parts = [esc(r.when), esc(r.memo), `<span class="st-${r.state}">${state}</span>`];
  return parts.filter(Boolean).join(" · ");
}

function renderChips() {
  const names = ["전체", ...new Set(RUNS.map(r => r.chip))];
  document.getElementById("chips").innerHTML = names.map(n =>
    `<button class="chip" type="button" aria-pressed="${n === chip}" data-chip="${esc(n)}">${esc(n)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { chip = b.dataset.chip; renderChips(); renderList(); });
}

function renderList() {
  const shown = RUNS.filter(r => chip === "전체" || r.chip === chip);
  document.getElementById("list").innerHTML = shown.map(r =>
    `<button class="item" type="button" data-id="${esc(r.id)}" aria-current="${r.id === current}">
       <div class="t">${esc(r.title)}</div><div class="m">${line(r)}</div></button>`).join("");
  document.querySelectorAll(".item").forEach(b => b.onclick = () => { location.hash = hashOf(b.dataset.id); });
}

// 결과 화면(report.html)을 불러와 그 스타일째로 따로 떼어 보여 준다 (목록 화면 스타일과 섞이지 않게)
async function openRun(id) {
  if (!id) return;
  current = id;
  renderList();
  const box = document.getElementById("report");
  document.getElementById("empty").hidden = true;
  box.hidden = false;
  try {
    const text = await (await fetch(`runs/${encodeURIComponent(id)}/report.html`)).text();
    const doc = new DOMParser().parseFromString(text, "text/html");
    const css = [...doc.querySelectorAll("style")].map(s => s.textContent).join("\n")
      .replace(/:root\[data-theme="dark"\]/g, ':host([data-theme="dark"])')
      .replace(/:root:not\(\[data-theme="light"\]\)/g, ':host(:not([data-theme="light"]))')
      .replace(/:root/g, ":host")
      .replace(/(^|[\s}])body\s*\{/g, "$1.report-body {");
    const root = box.shadowRoot || box.attachShadow({ mode: "open" });
    root.innerHTML = `<style>${css} .report-body { background: var(--bg); color: var(--fg); }</style>
                      <div class="report-body">${doc.body.innerHTML}</div>`;
    const theme = document.documentElement.getAttribute("data-theme");
    if (theme) box.setAttribute("data-theme", theme); else box.removeAttribute("data-theme");
  } catch (e) {
    box.textContent = "결과 화면을 불러오지 못했어요. 페이지를 새로고침해 주세요.";
  }
}

renderChips();
renderList();
window.addEventListener("hashchange", () => openRun(idOf(location.hash)));
openRun(idOf(location.hash) || (RUNS[0] && RUNS[0].id));
</script>
