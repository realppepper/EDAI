<svg class="w-full h-full text-slate-200" viewBox="0 0 920 340" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="pdg-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
  </marker>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.15"/>
  </filter>
</defs>
<!-- Column Stage Labels -->
  <text x="130" y="24" text-anchor="middle" font-size="10" font-weight="bold" fill="#64748b" letter-spacing="1">1. POWER &amp; GROUND</text>
  <text x="380" y="24" text-anchor="middle" font-size="10" font-weight="bold" fill="#64748b" letter-spacing="1">2. BIAS &amp; REFERENCE</text>
  <text x="610" y="24" text-anchor="middle" font-size="10" font-weight="bold" fill="#64748b" letter-spacing="1">3. SIGNAL &amp; CONTROL</text>
  <text x="820" y="24" text-anchor="middle" font-size="10" font-weight="bold" fill="#64748b" letter-spacing="1">4. OUTPUT &amp; STABILIZATION</text>
<path d="M 665 55 C 715.0 55, 715.0 55, 765 55" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#pdg-arr)"><title>1IN_P &rarr; OUT | &delta;=1.0&mu;s (Noninverting input; common-mode input range 0 to VCC - 1.7 V range per CMRR spec (VICR min 0 V))</title></path>
<path d="M 185 55 C 475.0 55, 475.0 55, 765 55" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#pdg-arr)"><title>GND &rarr; OUT | &delta;=1.0&mu;s (Negative supply / network ground reference for all voltages)</title></path>
<path d="M 185 55 C 370.0 55, 370.0 55, 555 55" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#pdg-arr)"><title>GND &rarr; 1IN_P | &delta;=2.0&mu;s (Operating point stabilization)</title></path>
<path d="M 185 55 C 370.0 55, 370.0 111, 555 111" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#pdg-arr)"><title>GND &rarr; 1IN_N | &delta;=2.0&mu;s (Operating point stabilization)</title></path>
<path d="M 665 111 C 715.0 111, 715.0 55, 765 55" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#pdg-arr)"><title>1IN_N &rarr; OUT | &delta;=1.0&mu;s (Inverting input; differential input voltage max +/-5.5 V)</title></path>
<path d="M 185 111 C 475.0 111, 475.0 55, 765 55" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#pdg-arr)"><title>VCC_P &rarr; OUT | &delta;=1.0&mu;s (Supply 2.7 V to 5.5 V (single-supply operation) required for output operation)</title></path>
<path d="M 185 111 C 370.0 111, 370.0 55, 555 55" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#pdg-arr)"><title>VCC_P &rarr; 1IN_P | &delta;=2.0&mu;s (Operating point stabilization)</title></path>
<path d="M 185 111 C 370.0 111, 370.0 111, 555 111" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#pdg-arr)"><title>VCC_P &rarr; 1IN_N | &delta;=2.0&mu;s (Operating point stabilization)</title></path>
<g class="node-pin" id="node-1IN_P">
  <rect x="555" y="33" width="110" height="44" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1.8" filter="url(#glow)"/>
  <text x="610" y="51" text-anchor="middle" font-size="11" font-weight="bold" fill="#f8fafc">1IN_P</text>
  <text x="610" y="67" text-anchor="middle" font-size="9" fill="#60a5fa" font-family="monospace">&sigma;=2.0 &mu;s</text>
</g>
<g class="node-pin" id="node-GND">
  <rect x="75" y="33" width="110" height="44" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.8" filter="url(#glow)"/>
  <text x="130" y="51" text-anchor="middle" font-size="11" font-weight="bold" fill="#f8fafc">GND</text>
  <text x="130" y="67" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="monospace">&sigma;=0.0 &mu;s</text>
</g>
<g class="node-pin" id="node-1IN_N">
  <rect x="555" y="89" width="110" height="44" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1.8" filter="url(#glow)"/>
  <text x="610" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#f8fafc">1IN_N</text>
  <text x="610" y="123" text-anchor="middle" font-size="9" fill="#60a5fa" font-family="monospace">&sigma;=2.0 &mu;s</text>
</g>
<g class="node-pin" id="node-OUT">
  <rect x="765" y="33" width="110" height="44" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.8" filter="url(#glow)"/>
  <text x="820" y="51" text-anchor="middle" font-size="11" font-weight="bold" fill="#f8fafc">OUT</text>
  <text x="820" y="67" text-anchor="middle" font-size="9" fill="#34d399" font-family="monospace">&sigma;=3.0 &mu;s</text>
</g>
<g class="node-pin" id="node-VCC_P">
  <rect x="75" y="89" width="110" height="44" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#glow)"/>
  <text x="130" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#f8fafc">VCC_P</text>
  <text x="130" y="123" text-anchor="middle" font-size="9" fill="#38bdf8" font-family="monospace">&sigma;=0.0 &mu;s</text>
</g>
</svg>